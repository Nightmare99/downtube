name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate version and existing Git tag
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          python3 scripts/version.py --check-tag "$RELEASE_TAG"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/installers.py
      - name: Check installer syntax
        run: |
          sh -n install.sh
          shellcheck install.sh
      - name: Select native build and installation runners
        id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          matrix = {'include': [
              {'runner': 'ubuntu-24.04', 'target': 'x86_64-unknown-linux-musl'},
              {'runner': 'ubuntu-24.04-arm', 'target': 'aarch64-unknown-linux-musl'},
              {'runner': 'macos-15-intel', 'target': 'x86_64-apple-darwin'},
              {'runner': 'macos-15', 'target': 'aarch64-apple-darwin'},
              {'runner': 'windows-2025', 'target': 'x86_64-pc-windows-msvc'},
              {'runner': 'windows-11-arm', 'target': 'aarch64-pc-windows-msvc'},
          ]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + json.dumps(matrix) + '\n')
          PY

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install musl build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Set up Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Test and build native binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --locked --release --bins --target "$TARGET"
      - name: Smoke test and package binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          for binary in downtube dtube; do
            actual=$("target/$TARGET/release/$binary$suffix" --version)
            test "$actual" = "downtube ${RELEASE_TAG#v}"
            "target/$TARGET/release/$binary$suffix" --help
          done
          python scripts/package-release.py --target "$TARGET"
      - name: Test PowerShell installer before publishing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -ExpandProperty FullName
          & ./tests/installers.ps1 -Archive $archive
      - name: Test Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows' && contains(matrix.target, 'x86_64')
        shell: powershell
        run: |
          $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -ExpandProperty FullName
          & ./tests/installers.ps1 -Archive $archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downtube-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: downtube-*
          path: dist
          merge-multiple: true
      - name: Assemble installers, checksums, and release notes
        run: |
          cp install.sh install.ps1 dist/
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          dist = pathlib.Path('dist')
          archives = list(dist.glob('*.tar.gz')) + list(dist.glob('*.zip'))
          assert len(archives) == 6, f'Expected six platform archives, found {len(archives)}'
          with (dist / 'SHA256SUMS').open('w') as manifest:
              for path in sorted(dist.iterdir()):
                  if path.name != 'SHA256SUMS':
                      manifest.write(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
          version = os.environ['RELEASE_TAG'][1:]
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = re.split(r'^## ', changelog, flags=re.M)[1:]
          notes = next(s for s in section if s.startswith(f'[{version}] - '))
          pathlib.Path('release-notes.md').write_text('## ' + notes.strip() + '\n\nInstallers, platform archives, and SHA-256 checksums are attached. See the README for installation and runtime dependencies.\n')
          PY
      - name: Publish versioned release
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "downtube $RELEASE_TAG" --notes-file release-notes.md

  install:
    name: Install published release (${{ matrix.target }})
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Install from the published shell installer
        if: runner.os != 'Windows'
        env:
          DOWNTUBE_INSTALL_DIR: ${{ runner.temp }}/downtube smoke/bin
          DOWNTUBE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          curl --fail --silent --show-error --location --retry 5 \
            "https://github.com/Nightmare99/downtube/releases/download/$RELEASE_TAG/install.sh" \
            -o "$RUNNER_TEMP/downtube-install.sh"
          sh "$RUNNER_TEMP/downtube-install.sh"
          for binary in downtube dtube; do
            actual=$("$DOWNTUBE_INSTALL_DIR/$binary" --version)
            test "$actual" = "downtube ${RELEASE_TAG#v}"
            "$DOWNTUBE_INSTALL_DIR/$binary" --help
          done
      - name: Install from the published PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'downtube-install.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'downtube smoke\bin'
          Invoke-WebRequest -Uri "https://github.com/Nightmare99/downtube/releases/download/$env:RELEASE_TAG/install.ps1" -OutFile $installer
          & $installer -Version $env:RELEASE_TAG -InstallDir $destination -NoModifyPath
          foreach ($binary in @('downtube.exe', 'dtube.exe')) {
            $actual = & (Join-Path $destination $binary) --version
            if ($LASTEXITCODE -ne 0 -or $actual -ne "downtube $($env:RELEASE_TAG.Substring(1))") { throw 'Installed binary version mismatch.' }
            & (Join-Path $destination $binary) --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed binary help failed.' }
          }
